onboarding = false
[theme]
name = "gruvbox"

# Follow the host terminal's light/dark appearance.
auto_switch = true

[keys]
# tmux: set -g prefix C-s
prefix = "ctrl+s"

# tmux: christoomey/vim-tmux-navigator — move between panes with ctrl+h/j/k/l,
# no prefix needed. (tmux also had prefix h/j/k/l via bind-key select-pane.)
# focus_pane_left = "ctrl+h"
# focus_pane_down = "ctrl+j"
# focus_pane_up = "ctrl+k"
# focus_pane_right = "ctrl+l"

# tmux: bind % split-window -h  (side-by-side panes, vertical divider)
split_vertical = "prefix+%"

# tmux: bind '"' split-window -v  (stacked panes, horizontal divider)
split_horizontal = 'prefix+"'

# tmux: bind c new-window
new_tab = "prefix+c"

# tmux: prefix+( / prefix+) cycle sessions - the workspace analog here.
previous_workspace = "prefix+)"
next_workspace = "prefix+("

# herdr-splits.nvim: seamless ctrl+h/j/k/l nav + alt+h/j/k/l resize across
# herdr panes and nvim splits (vim-aware; nvim half in nvim/lua/plugins/custom.lua)
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
